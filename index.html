<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>言葉ラボ — Kotoba Labo</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kotoba Labo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1d212b; --border:#2a2f3a;
    --text:#eef0f4; --text-dim:#a9afbc; --text-faint:#6b7280;
    --accent:#5b8cff; --accent2:#8b5bff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Zen Kaku Gothic New', system-ui, sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px;
  }
  .wrap{ max-width:480px; width:100%; }
  .hero{ text-align:center; margin-bottom:44px; }
  .hero .mark{ font-family:'Shippori Mincho', serif; font-size:44px; font-weight:700; letter-spacing:.04em; }
  .hero .sub{ display:block; margin-top:6px; color:var(--text-dim); font-family:'Space Grotesk', sans-serif; font-size:15px; letter-spacing:.08em; text-transform:uppercase; }
  .modes{ display:flex; flex-direction:column; gap:16px; }
  a.mode-card{
    display:flex; flex-direction:row; align-items:center; justify-content:flex-start; gap:18px;
    text-align:left; text-decoration:none; color:#ffffff;
    border-radius:16px; border:1px solid transparent;
    padding:22px 26px;
    transition:transform .15s ease, filter .15s ease;
  }
  a.mode-card:hover{ transform:translateY(-2px); filter:brightness(1.08); }
  a.mode-card.pitch-drill{ background:#2554d6; }
  a.mode-card.bunkei{ background:#7c3aed; }
  a.mode-card.jisho{ background:#0ea56f; }
  .mode-card .jp{ font-family:'Shippori Mincho', serif; font-size:40px; font-weight:700; color:#ffffff; line-height:1.1; }
  .mode-card .en{ display:block; margin-top:4px; font-family:'Space Grotesk', sans-serif; font-size:16px; font-weight:600; color:#ffffff; letter-spacing:.06em; text-transform:uppercase; opacity:.92; }
  .footer-note{ text-align:center; margin-top:36px; font-size:12px; color:var(--text-faint); }

  .offline-card{
    margin-top:28px; padding:16px 18px; border-radius:14px;
    background:var(--panel); border:1px solid var(--border);
  }
  .offline-card .offline-row{ display:flex; align-items:center; gap:12px; justify-content:space-between; }
  .offline-card .offline-label{ font-size:13px; color:var(--text-dim); line-height:1.4; }
  .offline-card .offline-label b{ color:var(--text); font-weight:600; }
  #btn-download-offline{
    flex-shrink:0; background:var(--accent); color:#fff; border:none; border-radius:10px;
    padding:10px 16px; font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:600;
    cursor:pointer; white-space:nowrap; transition:filter .15s ease;
  }
  #btn-download-offline:hover{ filter:brightness(1.1); }
  #btn-download-offline:disabled{ opacity:0.6; cursor:default; }
  #btn-download-offline.done{ background:#2f7d4f; }
  .offline-progress-wrap{ display:none; margin-top:12px; }
  .offline-progress-wrap.visible{ display:block; }
  .offline-progress-bar{ height:6px; border-radius:4px; background:var(--panel2); overflow:hidden; }
  .offline-progress-fill{ height:100%; width:0%; background:var(--accent); transition:width .2s ease; }
  .offline-progress-text{ margin-top:6px; font-size:11px; color:var(--text-faint); font-family:'Space Grotesk',sans-serif; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="mark">言葉ラボ</div>
      <span class="sub">Kotoba Labo</span>
    </div>
    <div class="modes">
      <a class="mode-card jisho" href="modes/jisho/index.html">
        <div class="jp">辞書</div>
        <span class="en">Dictionary</span>
      </a>
      <a class="mode-card bunkei" href="modes/bunkei/index.html">
        <div class="jp">文型</div>
        <span class="en">Grammar</span>
      </a>
      <a class="mode-card pitch-drill" href="modes/pitch_drill/index.html">
        <div class="jp">高低</div>
        <span class="en">Pitch Accent</span>
      </a>
    </div>
    <div class="offline-card">
      <div class="offline-row">
        <div class="offline-label" id="offline-label"><b>Download for offline use</b><br>Fetches all dictionary, grammar and audio data (~190MB) so every mode works with no connection.</div>
        <button id="btn-download-offline">⬇ Download</button>
      </div>
      <div class="offline-progress-wrap" id="offline-progress-wrap">
        <div class="offline-progress-bar"><div class="offline-progress-fill" id="offline-progress-fill"></div></div>
        <div class="offline-progress-text" id="offline-progress-text"></div>
      </div>
    </div>
    <div class="footer-note">KotobaLabo_v2.0</div>
  </div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch((err) => {
        console.warn('Service worker registration failed:', err);
      });
    });
  }

  /* ============ DOWNLOAD FOR OFFLINE USE ============
     All 3 modes share one data/ folder, so this lives once here on the
     landing page rather than being duplicated per mode. The actual file
     list and caching logic live in sw.js (see the 'message' listener
     there) so there's a single source of truth for what "everything" means
     and which cache it goes into -- this page just asks for it and shows
     progress. Approximate per-file sizes below are for the progress bar
     only (byte-weighted rather than a flat per-file count, since one file
     is ~100MB and the rest are comparatively tiny) -- they don't need to be
     exact, just roughly proportional. */
  const OFFLINE_FILE_SIZES = {
    'data.js': 17706130, 'freq.js': 3161129, 'glosses.js': 17333732,
    'jp_glosses.js': 12099901, 'names.js': 19508889, 'user_audio.js': 424613,
    'jlpt_vocab_tags.js': 273063, 'jlpt_grammar.js': 2233974,
    'freq_vocab_cloze_examples.js': 6262947, 'kanji_dict.js': 6910021,
    'anki_word_audio.js': 101304903, 'shared_sentences.json': 45
  };
  const OFFLINE_TOTAL_BYTES = Object.values(OFFLINE_FILE_SIZES).reduce((a,b)=>a+b, 0);
  const OFFLINE_DONE_KEY = 'kotobaLaboOfflineDownloaded';

  const btnOffline = document.getElementById('btn-download-offline');
  const progressWrap = document.getElementById('offline-progress-wrap');
  const progressFill = document.getElementById('offline-progress-fill');
  const progressText = document.getElementById('offline-progress-text');

  function setOfflineDone(){
    btnOffline.textContent = '✓ Available offline';
    btnOffline.classList.add('done');
    btnOffline.disabled = false;
    try{ localStorage.setItem(OFFLINE_DONE_KEY, '1'); }catch(e){}
  }

  if (!('serviceWorker' in navigator)) {
    btnOffline.disabled = true;
    btnOffline.textContent = 'Not supported in this browser';
  } else {
    try{ if(localStorage.getItem(OFFLINE_DONE_KEY) === '1') setOfflineDone(); }catch(e){}

    navigator.serviceWorker.addEventListener('message', (event) => {
      const msg = event.data;
      if (!msg) return;
      if (msg.type === 'CACHE_ALL_DATA_PROGRESS') {
        const sizeSoFar = Object.keys(OFFLINE_FILE_SIZES)
          .slice(0, msg.done)
          .reduce((sum, key) => sum + OFFLINE_FILE_SIZES[key], 0);
        const pct = Math.min(100, Math.round((sizeSoFar / OFFLINE_TOTAL_BYTES) * 100));
        progressFill.style.width = pct + '%';
        progressText.textContent = `${msg.file} — ${msg.done}/${msg.total} files (${pct}%)${msg.ok ? '' : ' — failed, will retry next time'}`;
      } else if (msg.type === 'CACHE_ALL_DATA_DONE') {
        progressFill.style.width = '100%';
        progressText.textContent = 'All set — everything is cached for offline use.';
        setOfflineDone();
      }
    });

    btnOffline.addEventListener('click', async () => {
      if (!confirm('This downloads about 190MB of dictionary and audio data for full offline use. Continue?')) return;
      btnOffline.disabled = true;
      btnOffline.textContent = 'Downloading…';
      progressWrap.classList.add('visible');
      progressText.textContent = 'Starting…';
      try {
        const reg = await navigator.serviceWorker.ready;
        let controller = navigator.serviceWorker.controller;
        if (!controller) {
          // First-ever visit: the service worker just installed but doesn't
          // control this already-open page yet (it takes over on the next
          // load). Wait briefly for that handoff instead of failing silently.
          controller = await new Promise((resolve) => {
            const onChange = () => { navigator.serviceWorker.removeEventListener('controllerchange', onChange); resolve(navigator.serviceWorker.controller); };
            navigator.serviceWorker.addEventListener('controllerchange', onChange);
            setTimeout(() => { navigator.serviceWorker.removeEventListener('controllerchange', onChange); resolve(navigator.serviceWorker.controller); }, 4000);
          });
        }
        if (!controller) {
          progressText.textContent = 'Please reload the page once, then try again (the app just installed itself).';
          btnOffline.disabled = false;
          btnOffline.textContent = '⬇ Download';
          return;
        }
        controller.postMessage({ type: 'CACHE_ALL_DATA' });
      } catch (err) {
        progressText.textContent = 'Something went wrong starting the download. Please try again.';
        btnOffline.disabled = false;
        btnOffline.textContent = '⬇ Download';
      }
    });
  }
</script>
</body>
</html>
